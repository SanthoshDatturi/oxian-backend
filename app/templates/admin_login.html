<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oxian Admin Login</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18201a;
      --muted: #647067;
      --line: #d9e2dc;
      --field: #f7faf8;
      --accent: #196f3d;
      --danger: #a33422;
      --page: #eef4ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--page);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(420px, calc(100vw - 32px));
      background: #fbfdfb;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 18px 60px rgb(38 67 44 / 14%);
    }
    h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: 0; }
    p { margin: 0 0 22px; color: var(--muted); line-height: 1.45; }
    label { display: block; margin: 14px 0 6px; font-weight: 650; }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      background: var(--field);
      color: var(--ink);
      font: inherit;
    }
    button {
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 6px;
      padding: 12px 14px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .64; cursor: progress; }
    .status { min-height: 22px; margin-top: 14px; color: var(--muted); }
    .error { color: var(--danger); }
  </style>
</head>
<body>
  <main>
    <h1>Oxian Admin</h1>
    <p>Sign in with an admin Firebase account to manage crop image references.</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit">Sign in</button>
      <div id="status" class="status"> </div>
    </form>
  </main>
  <script id="firebase-config" type="application/json">{{ firebase_config_json|safe }}</script>
  <script id="missing-config" type="application/json">{{ missing_config_json|safe }}</script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const firebaseConfig = JSON.parse(document.querySelector("#firebase-config").textContent);
    const missingConfig = JSON.parse(document.querySelector("#missing-config").textContent);
    const status = document.querySelector("#status");
    const form = document.querySelector("#login-form");
    const button = document.querySelector("#submit");

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.className = isError ? "status error" : "status";
    }

    if (missingConfig) {
      setStatus("Firebase web configuration is missing on the server.", true);
      button.disabled = true;
    }

    const app = missingConfig ? null : initializeApp(firebaseConfig);
    const auth = app ? getAuth(app) : null;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      setStatus("Checking credentials...");
      try {
        const email = document.querySelector("#email").value;
        const password = document.querySelector("#password").value;
        const credential = await signInWithEmailAndPassword(auth, email, password);
        const tokenResult = await credential.user.getIdTokenResult(true);
        if (tokenResult.claims.role !== "admin") {
          await signOut(auth);
          sessionStorage.removeItem("adminIdToken");
          setStatus("This account is not authorized for admin access.", true);
          return;
        }
        sessionStorage.setItem("adminIdToken", tokenResult.token);
        window.location.assign("/admin/crop-images");
      } catch (error) {
        setStatus(error?.message || "Sign in failed.", true);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
