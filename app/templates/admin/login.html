<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oxian Admin Login</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body class="centered">
  <main class="card container-narrow">
    <h1>Oxian Admin</h1>
    <p>Sign in with an admin Firebase account to manage crop image references.</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit" class="btn-primary" style="width:100%;margin-top:18px;">Sign in</button>
      <div id="status" class="status"> </div>
    </form>
  </main>
  <script id="firebase-config" type="application/json">{{ firebase_config_json|safe }}</script>
  <script id="missing-config" type="application/json">{{ missing_config_json|safe }}</script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const firebaseConfig = JSON.parse(document.querySelector("#firebase-config").textContent);
    const missingConfig = JSON.parse(document.querySelector("#missing-config").textContent);
    const status = document.querySelector("#status");
    const form = document.querySelector("#login-form");
    const button = document.querySelector("#submit");

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.className = isError ? "status error" : "status";
    }

    if (missingConfig) {
      setStatus("Firebase web configuration is missing on the server.", true);
      button.disabled = true;
    }

    const app = missingConfig ? null : initializeApp(firebaseConfig);
    const auth = app ? getAuth(app) : null;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      setStatus("Checking credentials...");
      try {
        const email = document.querySelector("#email").value;
        const password = document.querySelector("#password").value;
        const credential = await signInWithEmailAndPassword(auth, email, password);
        const tokenResult = await credential.user.getIdTokenResult(true);
        if (tokenResult.claims.role !== "admin") {
          await signOut(auth);
          sessionStorage.removeItem("adminIdToken");
          setStatus("This account is not authorized for admin access.", true);
          return;
        }
        sessionStorage.setItem("adminIdToken", tokenResult.token);
        window.location.assign("/admin/crop-images");
      } catch (error) {
        setStatus(error?.message || "Sign in failed.", true);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
